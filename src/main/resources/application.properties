spring.application.name=wordie
spring.datasource.url=jdbc:postgresql://localhost:5432/wordie_db
spring.datasource.username=wordie_user
spring.datasource.password=wordie_pass

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect