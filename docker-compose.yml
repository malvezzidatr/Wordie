version: "3.9"
services:
  postgres:
    image: postgres:15
    container_name: wordie-postgres
    restart: always
    environment:
      POSTGRES_USER: wordie_user
      POSTGRES_PASSWORD: wordie_pass
      POSTGRES_DB: wordie_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: